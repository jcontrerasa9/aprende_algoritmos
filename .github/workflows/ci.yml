name: CI

on:
  pull_request:
  push:
    branches: [main] # cuando se haga un PR a main

jobs:
  checks:
    runs-on: ubuntu-latest # crea una maquina ubuntu vacia
    steps:
      - uses: actions/checkout@v7 # descarga el codigo 
      - uses: actions/setup-node@v7 # instala node
        with:
          node-version: 24
          cache: npm
      - run: npm ci # instala las dependencias de package-lock.json (versiones exactas)
      - run: npm run lint # corre ESLint (busca errores, malas practicas e inconsistencias)
      - run: npx tsc -b # revisa los tipos de variables 
      - run: npm test # ejecuta las pruebas unitarias
